<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<style>

        padding:40px;

        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h2{
        text-align:center;
        margin-bottom:30px;
    }

    table{

    }

    .section-title{
        font-size:22px;
        font-weight:bold;
        margin:30px 0 15px;
    }
</style>

<body>

<div class="container">

</thead>

<tbody>

</tbody>
</table>

Student List
